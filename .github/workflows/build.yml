name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Theos (roothide fork) and toolchain
        uses: Randomblock1/theos-action@main
        with:
          theos-src: https://github.com/roothide/theos
          theos-sdks: https://github.com/theos/sdks

      - name: Build SpringBoard package
        run: |
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide DEBUG=0
          ls -la packages/

      - name: Build app-side package
        working-directory: sbapp
        run: |
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide DEBUG=0
          ls -la packages/

      - name: Build backboardd probe package
        working-directory: sbprobe
        run: |
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide DEBUG=0
          ls -la packages/

      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: |
            packages/*.deb
            sbapp/packages/*.deb
            sbprobe/packages/*.deb
