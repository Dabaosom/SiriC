name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Theos (roothide) and toolchain
        uses: Randomblock1/theos-action@main
        with:
          theos-url: https://github.com/roothide/theos
          theos-ref: master

      - name: Build package
        run: |
          export THEOS_PACKAGE_SCHEME=roothide
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide DEBUG=0
          ls -la packages/

      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: packages/*.deb
